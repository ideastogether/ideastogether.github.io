<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日自動更新｜點子共玩所</title>
<style>body{font:16px system-ui;max-width:920px;margin:24px auto;padding:16px;background:#faf7f1;color:#36332f}section{background:white;padding:16px;margin:16px 0;border:1px solid #ddd3c7;border-radius:12px}button,input,textarea{font:inherit;padding:10px;box-sizing:border-box}textarea{width:100%;min-height:130px}input:not([type=checkbox]),select{max-width:100%;font:inherit;padding:10px;box-sizing:border-box}form input,form select{width:100%}.draft-copy{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}h3{overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{margin:0}button,select{min-height:44px}summary{cursor:pointer;padding:12px 0}time{font-size:14px;color:#756f69}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{margin:8px;border-radius:8px;background:white;border:1px solid #b8a99a}label{display:block;margin:12px 0}</style>
<h1>每日自動更新</h1><p><a href="../#/admin">返回後台登入</a> · <a href="ai-import.html">活動雲端草稿</a> · <a href="https://github.com/ideastogether/ideastogether.github.io/actions/workflows/daily-content-update.yml" target="_blank" rel="noopener">GitHub Actions 立即執行</a></p>
<p>手動與自動共用台灣日期每日一次限制，失敗也不重跑。不使用付費 AI；遊戲庫耗盡即停止新增。</p><p id="message" role="status">驗證管理員中…</p><main hidden>
<section><label><input id="enabled" type="checkbox"> 開啟每日更新</label><label>每日活動數量 <input id="events" type="number" min="0" max="5" value="5"></label><label>每日遊戲數量 <input id="games" type="number" min="0" max="5" value="5"></label><button id="save">儲存設定</button><h2>最近執行紀錄</h2><div id="logs"></div></section>
<section><h2>遊戲雲端草稿</h2><p>先閱讀草稿，需要修改時點「編輯」。送審時會一併儲存修改，再到後台確認發布。</p><div id="drafts"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script type="module">
const sb=supabase.createClient('https://impuxatitpghslleasma.supabase.co','sb_publishable_bufFrNEhfUMxuwNmFOosRg_rPiekiNf');
const $=id=>document.getElementById(id);let uid;
const check=r=>{if(r.error)throw Error(r.error.message);return r.data};
async function load(){
const s=check(await sb.from('daily_content_settings').select('*').single());$('enabled').checked=s.enabled;$('events').value=s.event_limit;$('games').value=s.game_limit;
const logs=check(await sb.from('daily_content_runs').select('*').order('day',{ascending:false}).limit(10));
$('logs').replaceChildren();
if(!logs.length)$('logs').textContent='尚未執行更新';
for(const r of logs){const box=document.createElement('section');
const status={completed:'更新完成',failed:'更新失敗',running:'更新中'}[r.status]||'待確認';
const time=r.finished_at||r.started_at;const when=time?new Date(time).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}):r.day;
const heading=document.createElement('h3');heading.textContent=status;const text=document.createElement('p');text.textContent=when+'（台灣時間）';
const counts=document.createElement('p');counts.textContent=`活動 ${r.events||0} 筆 · 遊戲 ${r.games||0} 個 · 排除重複 ${r.duplicates||0} 筆`;
box.append(heading,text,counts);if(r.error){const error=document.createElement('p');error.textContent='未完成原因：'+r.error;box.append(error)}$('logs').append(box)}
const ages=['0 歲以上','1 歲以上','2 歲以上','3 歲以上','4 歲以上','6 歲以上','6 歲以上','8 歲以上','10 歲以上'];
const drafts=check(await sb.from('game_cloud_drafts').select('*').order('created_at',{ascending:false}).limit(100));
$('drafts').replaceChildren();if(!drafts.length)$('drafts').textContent='目前沒有待處理的遊戲草稿。';
for(const d of drafts){
const box=document.createElement('section'),title=document.createElement('h3');title.textContent=d.title;box.append(title);
const preview=document.createElement('div');preview.className='draft-copy';
function render(g){preview.replaceChildren();for(const [label,value] of [['適合年齡',ages[g.age]||'未提供'],['準備材料',(g.materials||[]).join('、')||'不需要材料'],['遊玩時間',g.duration_label||'未提供'],['詳細玩法',g.how],['遊戲標籤',(g.tags||[]).join('、')||'未提供']]){const h=document.createElement('strong'),p=document.createElement('p');h.textContent=label;p.textContent=value||'未提供';preview.append(h,p)}}render(d.payload);box.append(preview);
const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='編輯草稿';details.append(summary);
const form=document.createElement('form');form.noValidate=false;details.append(form);box.append(details);
const inputs={};
for(const [name,label,kind] of [['title','遊戲名稱','input'],['age','適合年齡','select'],['materials','準備材料（每行一項）','textarea'],['duration_label','預估遊玩時間','input'],['how','詳細玩法','textarea'],['tags','遊戲標籤（每行一項）','textarea']]){
const wrap=document.createElement('label'),caption=document.createElement('span'),input=document.createElement(kind);caption.textContent=label;input.name=name;
if(kind==='select'){ages.forEach((text,i)=>{if(i===6)return;const option=document.createElement('option');option.value=i;option.textContent=text;input.append(option)})}
input.value=Array.isArray(d.payload[name])?d.payload[name].join('\n'):String(d.payload[name]??'');if(name==='title'||name==='how')input.required=true;
if(name==='title')input.maxLength=50;inputs[name]=input;wrap.append(caption,input);form.append(wrap)}
const collect=()=>({...d.payload,title:inputs.title.value.trim(),age:Number(inputs.age.value),materials:inputs.materials.value.split('\n').map(x=>x.trim()).filter(Boolean),duration_label:inputs.duration_label.value.trim(),how:inputs.how.value.trim(),tags:inputs.tags.value.split('\n').map(x=>x.trim()).filter(Boolean)});
async function save(){if(!form.reportValidity())throw Error('請填寫遊戲名稱與玩法');const payload=collect();if(!payload.title||!payload.how)throw Error('請填寫遊戲名稱與玩法');check(await sb.from('game_cloud_drafts').update({title:payload.title,payload}).eq('id',d.id));title.textContent=payload.title;render(payload);details.open=false}
const saveButton=document.createElement('button');saveButton.type='submit';saveButton.textContent='儲存修改';form.append(saveButton);form.onsubmit=e=>{e.preventDefault();run(save)};
const actions=document.createElement('div');actions.className='actions';
for(const [label,action] of [['確認內容並送審',async()=>{await save();check(await sb.rpc('submit_game_cloud_draft',{p_id:d.id}));await load();$('message').replaceChildren(document.createTextNode('已送審，尚未公開。'));const link=document.createElement('a');link.href='../#/admin';link.textContent='前往後台確認發布';$('message').append(' ',link)}],['刪除草稿',async()=>{if(!confirm('刪除此草稿？'))return;check(await sb.from('game_cloud_drafts').delete().eq('id',d.id));await load()}]]){const button=document.createElement('button');button.textContent=label;button.onclick=()=>run(async()=>{button.disabled=true;try{await action()}finally{button.disabled=false}},label==='確認內容並送審');actions.append(button)}box.append(actions);$('drafts').append(box)}
}
async function run(fn,keepMessage=false){try{await fn();if(!keepMessage)$('message').textContent='完成'}catch(e){$('message').textContent=e.message}}
$('save').onclick=()=>run(async()=>{const a=Number($('events').value),b=Number($('games').value);if(![a,b].every(n=>Number.isInteger(n)&&n>=0&&n<=5))throw Error('數量須為 0～5');check(await sb.from('daily_content_settings').update({enabled:$('enabled').checked,event_limit:a,game_limit:b}).eq('id',1));await load()});
run(async()=>{const u=check(await sb.auth.getUser()).user;if(!u)throw Error('請先回後台登入管理員');uid=u.id;const p=check(await sb.from('profiles').select('is_admin,suspended').eq('id',uid).single());if(!p.is_admin||p.suspended)throw Error('僅管理員可操作');document.querySelector('main').hidden=false;await load()});
</script></html>
